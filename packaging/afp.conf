;
; afprustd configuration.
;
; The format is the same as netatalk 3/4's afp.conf, so an existing netatalk
; configuration can be used as is (point AFPRUSTD_OPTS in
; /etc/default/afprustd at it). Options that make no sense for AFP 2.x
; clients are accepted and ignored; "afprustd -t" lists them.
;
; After editing: sudo afprustd -t && sudo systemctl reload afprustd
;

[Global]
; Name shown in the Chooser. Defaults to the host name.
;server name = Raspberry Pi

; Authentication methods offered to clients:
;   uams_dhx.so     DHCAST128: password encrypted (weakly) on the wire.
;                   Mac OS 9.0.4 and later (AppleShare Client 3.8.4+).
;   uams_clrtxt.so  Cleartext password. Needed for Mac OS 8.x / 9.0-9.0.3.
;                   Anyone on the network can read the password.
;   uams_guest.so   Guest access, mapped to the "guest account" below.
; Passwords are checked through PAM (service "afprust"), i.e. against the
; normal Linux accounts.
uam list = uams_dhx.so

;guest account = nobody

; Show the server in the Mac OS Chooser over AppleTalk. Macs then connect
; over TCP/IP. Needs the kernel "appletalk" module (loaded automatically).
;appletalk = yes
;ddp interface = eth0

; Message shown after login.
;login message = Welcome to the Raspberry Pi.

; Listen address(es); the default is all IPv4 addresses on port 548.
;afp listen = 192.168.1.10

;log level = default:info
;max connections = 200

; Every user gets a volume with their home directory.
[Homes]
basedir regex = /home

; A shared volume:
;[Mac Share]
;path = /srv/mac
;valid users = @staff
;file perm = 0660
;directory perm = 0770

; A read-only volume for everyone, including guests:
;[Software]
;path = /srv/software
;read only = yes
