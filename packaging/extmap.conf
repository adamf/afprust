# afprustd file extension -> Mac OS type/creator mapping.
# Same format as netatalk's extmap.conf / AppleVolumes.system:
#   .extension  "TYPE"  "CREA"   [description...]
# Used only for files that have no stored Finder info. A line starting with
# a single "." sets the default for unknown extensions.
#
#.         "????"  "????"

